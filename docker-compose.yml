services:
  mariadb:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: taxonomy_classifier
      MARIADB_USER: taxonomy_user
      MARIADB_PASSWORD: taxonomy_password
      MARIADB_ROOT_PASSWORD: root_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
volumes:
  mariadb_data:
